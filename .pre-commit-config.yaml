# Pre-commit hook: chan secret TRUOC KHI commit (khong doi den CI).
# Cai dat: pip install pre-commit && pre-commit install
# Test:    pre-commit run --all-files
repos:
  - repo: local
    hooks:
      - id: gitleaks
        name: Gitleaks secret scan
        entry: gitleaks protect --staged --verbose --redact --config .gitleaks.toml
        language: system
        pass_filenames: false
