name: Security Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# ======================================================================
# Stage 1-2 pipeline — Sprint 2 Week 1
#
# CHE DO HIEN TAI: DETECT + REPORT (khong chan).
# Ly do: demo app CO Y chua loi (xem app/app.py [SEEDED #1..#3]) de chung minh
# scanner hoat dong. Neu bat --error / exit-code=1 ngay bay gio thi MOI lan
# push deu do — khong phan biet duoc "push sach" voi "push co loi".
#
# ENFORCEMENT (Quality Gate: Critical -> fail) la task Sprint 2 Week 3
# (Mlo Tay: "Integrate Security Quality Gate logic"). Luc do se bat lai.
# ======================================================================

jobs:
  # ----------------------------------------------------------------
  # Stage 1 — Secret detection
  # ----------------------------------------------------------------
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Job nay CHAN: phat hien secret moi (ngoai .gitleaksignore) => fail.
      # Day chinh la done-when Week 1: "push with fake secret -> failed run".
      - name: Gitleaks - secret detection
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Tu-kiem-tra: chung minh detector THUC SU bat duoc secret.
      # Tao 1 file chua secret gia, chay gitleaks, KY VONG exit 1.
      # Neu detector hong (exit 0) thi job nay fail — khong the "xanh gia".
      #
      # LUU Y 1: KHONG dung key vi du trong tai lieu AWS (dang "AKIA" + "IOSFODNN7EXAMPLE").
      #   Key do nam trong allowlist MAC DINH cua gitleaks -> tra ve exit 0
      #   -> job nay fail SAI LY DO. Da kiem chung cuc bo voi gitleaks 8.30.1.
      #
      # LUU Y 2: key duoc GHEP LUC CHAY, khong viet literal trong repo.
      #   Neu viet literal, chinh pre-commit hook cua repo (gitleaks protect --staged)
      #   se chan commit nay. Ghep chuoi giu nguyen hanh vi test ma khong luu secret.
      - name: Self-test - detector must catch a planted secret
        run: |
          set +e
          curl -sSL -o /tmp/gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          mkdir -p /tmp/selftest
          KEY="AKIA""ZZ7XQ2WPLMN4RTUV"
          printf 'AWS_ACCESS_KEY_ID = "%s"\n' "$KEY" > /tmp/selftest/planted.py
          /tmp/gitleaks detect --source /tmp/selftest --no-git --config .gitleaks.toml --redact
          rc=$?
          echo "gitleaks exit code = $rc (ky vong: 1)"
          if [ "$rc" -ne 1 ]; then
            echo "::error::Detector KHONG bat duoc secret da cai — pipeline bao xanh gia!"
            exit 1
          fi
          echo "OK: detector bat duoc secret nhu thiet ke."

  trufflehog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: TruffleHog - verified secret detection
        uses: trufflesecurity/trufflehog@main
        with:
          extra_args: --only-verified --results=verified,unknown

  # ----------------------------------------------------------------
  # Stage 2 — SAST + SCA
  # ----------------------------------------------------------------
  semgrep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Semgrep
        run: pip install semgrep
      - name: Semgrep - SAST scan (SARIF)
        # --config auto: bat day du (ke ca SQLi trong app.py dong 35).
        # Truoc day dung p/owasp-top-ten — ruleset do KHONG bat duoc SQLi da seed.
        # Chua dung --error: xem ghi chu ENFORCEMENT o dau file.
        # FIX 01/10: semgrep KHONG cho dung --output 2 lan trong 1 lenh
        # (exit 2: "option '--output' cannot be repeated") → tach 2 lan chay.
        run: semgrep scan --config auto --sarif --output semgrep-results.sarif
        continue-on-error: true
      - name: Semgrep - SAST scan (JSON)
        run: semgrep scan --config auto --json --output semgrep-results.json
        continue-on-error: true
      - name: Show finding summary
        if: always()
        run: |
          if [ -f semgrep-results.json ]; then
            python3 -c "import json;d=json.load(open('semgrep-results.json'));print('Semgrep findings:',len(d.get('results',[])))"
          fi
      - name: Upload Semgrep SARIF
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-sarif
          path: semgrep-results.sarif

  trivy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Trivy - SCA scan
        # FIX 01/10: tag 0.28.0 KHONG ton tai (tag that la v0.28.0) → job fail "Set up job".
        uses: aquasecurity/trivy-action@v0.28.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH,MEDIUM
          trivyignores: .trivyignore
          exit-code: '0' # report-only o Week 1; bat '1' o Week 3
      - name: Upload Trivy SARIF
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-sarif
          path: trivy-results.sarif
